<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Saya</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
            width: 700px;
        }

        .profil-container {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .foto-profil {
            width: 180px;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
            border: 3px solid #ddd;
        }

        .info h2 {
            margin: 0 0 10px 0;
            font-size: 28px;
            color: #333;
        }

        .info p {
            margin: 8px 0;
            color: #555;
            font-size: 16px;
        }

        .tentang {
            margin-top: 30px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        .tentang h3 {
            margin-bottom: 12px;
            font-size: 20px;
            color: #333;
        }

        .tentang p {
            font-size: 15px;
            color: #666;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Bagian Foto dan Identitas -->
        <div class="profil-container">
            <img src="RAFI.jpg" alt="Foto Profil Rafi" class="foto-profil">
            <div class="info">
                <h2>Rafi Rasydan AlVakri</h2>
                <p><strong>NIM:</strong> 24040700068</p>
                <p><strong>Program Studi:</strong> Teknik Informatika</p>
            </div>
        </div>

        <!-- Bagian Tentang Saya -->
        <div class="tentang">
            <h3>Tentang Saya</h3>
            <p>Halo! Saya adalah mahasiswa yang sedang mempelajari dasar-dasar pemrograman web dan pengelolaan lokal server menggunakan XAMPP untuk memenuhi Tugas 2.</p>
            <p>Kunjungi <a href="https://instagram.com" target="_blank">Instagram Saya</a> untuk terhubung lebih lanjut.</p>
        </div>
    </div>

</body>
</html>
